[PHP]
post_max_size = 50M
upload_max_filesize = 50M
max_execution_time = 120
memory_limit = 192M
expose_php = Off

; Opcache is mandatory here: the box has few cores and recompiling every
; Laravel file per request is the single largest avoidable cost.
; validate_timestamps=0 means code changes require a container restart —
; correct for immutable images, wrong for the dev config in php.ini.
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
; Laravel resolves some bindings through docblocks; keep comments.
opcache.save_comments = 1
