[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Sized for a 2 vCPU box. Worst case is max_children x memory_limit
; (8 x 192M = 1.5G), which is why the app container carries a hard memory
; limit in docker-compose.prod.yml. Raise only alongside that limit.
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no

catch_workers_output = yes
decorate_workers_output = no
