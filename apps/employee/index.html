<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👤</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Employee WPA - HRIS Modern Suite</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Theme Detection & Initial Loader Styling -->
    <script>
      (function() {
        const appearance = localStorage.getItem('appearance') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = appearance === 'dark' || (appearance === 'system' && prefersDark);
        
        const containerStyle = document.createElement('style');
        containerStyle.id = 'initial-loader-theme';
        containerStyle.innerHTML = isDark 
          ? '.loader-container { background-color: oklch(0.145 0 0) !important; } .loader-text { color: oklch(0.985 0 0) !important; } .spinner { border-top-color: oklch(0.922 0 0) !important; border-color: oklch(1 0 0 / 10%) !important; }'
          : '.loader-container { background-color: oklch(1 0 0) !important; } .loader-text { color: oklch(0.145 0 0) !important; } .spinner { border-top-color: oklch(0.205 0 0) !important; border-color: oklch(0.922 0 0) !important; }';
        document.head.appendChild(containerStyle);
        
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-x-hidden">
    <div id="root">
      <!-- Premium CSS Initial Loader -->
      <style>
        .loader-container {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: #020617;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: 'Outfit', 'Inter', sans-serif;
          z-index: 9999;
        }
        .spinner {
          width: 50px;
          height: 50px;
          border: 3px solid rgba(99, 102, 241, 0.1);
          border-radius: 50%;
          border-top-color: #6366f1;
          animation: spin 1s ease-in-out infinite;
        }
        .loader-text {
          margin-top: 1.5rem;
          color: #94a3b8;
          font-size: 0.875rem;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
      </style>
      <div class="loader-container">
        <div class="spinner"></div>
        <div class="loader-text">Loading WPA Employee...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
